<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Language switcher exposure</title>
  </head>
  <body>
    <main>
      <h1>Language switcher</h1>
      <p id="intro">Current language: English.</p>
      <button id="switch-language" type="button">Switch language</button>
      <section id="spanish-panel" lang="es" hidden>
        <h2>Bienvenido al panel</h2>
        <p>El contenido visible cambio a espanol para esta ruta de prueba.</p>
      </section>
    </main>
    <script>
      document.querySelector("#switch-language").addEventListener("click", () => {
        document.querySelector("#intro").textContent = "Current language: Spanish.";
        document.querySelector("#spanish-panel").hidden = false;
      });
    </script>
  </body>
</html>
