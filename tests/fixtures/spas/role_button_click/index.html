<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Role button fixture</title>
    <style>
      [role="button"] {
        display: inline-block;
        padding: 8px 10px;
        border: 1px solid #555;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Role button fixture</h1>
      <p id="status">Role state closed</p>
      <div id="role-action" role="button" tabindex="0">Open role state</div>
      <section id="role-state" hidden>
        <h2>Role button state visible</h2>
      </section>
    </main>
    <script>
      document.querySelector("#role-action").addEventListener("click", () => {
        document.querySelector("#status").textContent = "Role state open";
        document.querySelector("#role-state").hidden = false;
      });
    </script>
  </body>
</html>
